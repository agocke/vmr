name: Bazel Build

on:
  push:
    branches: [ bazel ]
  pull_request:
    branches: [ bazel ]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: Linux release
            config: clr_release
          - os: ubuntu-latest
            name: Linux checked
            config: clr_checked
          - os: macos-latest
            name: macOS release
            config: clr_release

    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -qq -y clang-18 lld libkrb5-dev liblttng-ust-dev

      - name: Mount Bazel cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/bazel-disk
          key: bazel-${{ runner.os }}-${{ matrix.config }}-${{ hashFiles('MODULE.bazel', 'MODULE.bazel.lock', '.bazelrc') }}-${{ github.sha }}
          restore-keys: |
            bazel-${{ runner.os }}-${{ matrix.config }}-${{ hashFiles('MODULE.bazel', 'MODULE.bazel.lock', '.bazelrc') }}-
            bazel-${{ runner.os }}-${{ matrix.config }}-

      - name: Build
        run: |
          bazel build --disk_cache=~/.cache/bazel-disk \
            --config=${{ matrix.config }} \
            @dotnet_runtime//:runtime_archive \
            //src/roslyn/src/Compilers/CSharp/csc:csc \
            //src/roslyn/src/Compilers/Server/VBCSCompiler:VBCSCompiler

      - name: Test
        run: |
          bazel test --disk_cache=~/.cache/bazel-disk \
            --config=${{ matrix.config }} \
            //src/roslyn/src/Compilers/CSharp/Test/Syntax:Microsoft.CodeAnalysis.CSharp.Syntax.UnitTests \
            //src/roslyn/src/Compilers/CSharp/Test/Semantic:Microsoft.CodeAnalysis.CSharp.Semantic.UnitTests \
            //src/roslyn/src/Compilers/CSharp/Test/Symbol:Microsoft.CodeAnalysis.CSharp.Symbol.UnitTests \
            //src/roslyn/src/Compilers/CSharp/Test/Emit:Microsoft.CodeAnalysis.CSharp.Emit.UnitTests \
            //src/roslyn/src/Compilers/CSharp/Test/Emit2:Microsoft.CodeAnalysis.CSharp.Emit2.UnitTests \
            //src/roslyn/src/Compilers/CSharp/Test/Emit3:Microsoft.CodeAnalysis.CSharp.Emit3.UnitTests \
            //src/roslyn/src/Compilers/CSharp/Test/CommandLine:Microsoft.CodeAnalysis.CSharp.CommandLine.UnitTests \
            --test_timeout=300
