name: Sync runtime from agocke/rbz

on:
  schedule:
    - cron: '0 */6 * * *'  # Every 6 hours
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    name: Sync runtime sources
    runs-on: ubuntu-latest
    steps:
      - name: Checkout VMR
        uses: actions/checkout@v5
        with:
          ref: bazel
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Clone runtime fork
        run: |
          git clone --branch bazel --single-branch --depth 1 \
            https://github.com/agocke/rbz.git /tmp/rbz

      - name: Sync sources
        run: |
          # Remove existing runtime sources (preserving .git-related metadata)
          rm -rf src/runtime
          # Copy fresh sources from rbz
          cp -a /tmp/rbz src/runtime
          # Remove the .git directory from the copy
          rm -rf src/runtime/.git

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet && [ -z "$(git ls-files --others --exclude-standard)" ]; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create or update PR
        if: steps.changes.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="auto/sync-runtime"
          git checkout -B "$BRANCH"
          git add -A
          COMMIT_SHA=$(git -C /tmp/rbz rev-parse --short HEAD)
          git commit -m "Sync runtime sources from agocke/rbz@${COMMIT_SHA}"
          git push -f origin "$BRANCH"

          # Create or update PR
          EXISTING_PR=$(gh pr list --head "$BRANCH" --base bazel --json number -q '.[0].number')
          if [ -n "$EXISTING_PR" ]; then
            echo "Updating existing PR #${EXISTING_PR}"
          else
            gh pr create \
              --base bazel \
              --head "$BRANCH" \
              --title "Sync runtime sources from agocke/rbz" \
              --body "Automated sync of runtime sources from [agocke/rbz](https://github.com/agocke/rbz) bazel branch (${COMMIT_SHA})."
          fi
