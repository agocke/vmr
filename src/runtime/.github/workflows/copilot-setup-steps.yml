name: "Copilot Setup Steps"

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  # The job MUST be called `copilot-setup-steps` or it will not be picked up by Copilot.
  copilot-setup-steps:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install dotnet SDK
        run: |
          # dotnet.sh sources eng/common/tools.sh and runs InitializeDotNetCli,
          # which installs the SDK version from global.json into .dotnet/.
          ./dotnet.sh --info

      - name: Install paket
        run: dotnet tool install -g paket --add-source https://api.nuget.org/v3/index.json

      - name: Verify Bazel (pre-installed via Bazelisk)
        run: bazel version

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -qq -y clang-18 lld libkrb5-dev liblttng-ust-dev
